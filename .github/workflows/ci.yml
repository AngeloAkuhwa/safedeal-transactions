# Every gate this repo already has, made binding.
#
# Before this workflow existed, typecheck, 815 tests, the lint baseline, the
# money guards and the mobile render audit all ran only when someone remembered
# to run them locally. On a product that holds other people's money, "we ran it
# locally" is not a control.
#
# Two things are deliberate:
#
#   - `admin-auth.contract.test.ts` asserts server-side role enforcement on
#     every admin edge function. Those tests skip themselves when their
#     credentials are absent, and a skip prints in grey next to a green tick.
#     The step below fails the build if they skip again, so a missing secret is
#     loud instead of invisible.
#
#   - The render audit needs signed-in identities. They are provisioned
#     out-of-band (see the note below) with passwords that live only in these
#     secrets, so no credential that authenticates ever exists in the repo.
#
# Required repository secrets:
#   E2E_BUYER_PASSWORD, E2E_SELLER_PASSWORD, E2E_ADMIN_PASSWORD
#
# NOTE — the project URL and anon key are deliberately NOT secrets. They are
# public values that ship inside the client bundle, and they already live in
# the repo's tracked `.env`. Duplicating them into repository secrets meant CI
# could be pointed at a DIFFERENT Supabase project than the one every local
# run and every seeded account uses — and because `process.env` wins over
# `.env` in Vite, the secret silently overrode the correct value. Public
# routes still rendered, so the app "booted fine", while every password grant
# came back 400 from a project that had never heard of these accounts. CI now
# reads the same `.env` the developer does, so there is one source of truth.
#
# NOTE — no SUPABASE_SERVICE_ROLE_KEY. This project runs on Lovable Cloud,
# where the Supabase instance is owned and managed by Lovable: there is no
# dashboard, no service role key and no database URL available to the project
# owner. CI therefore cannot provision identities itself. They are provisioned
# out-of-band once (scripts/provision-e2e-identities.mjs --sql, run through
# Lovable) with passwords that exist only in these secrets, and CI signs in
# with them. Rotate by re-running that script with new values.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck · build · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build
        run: bun run build
      - name: Lint must not regress
        # The repo carries a known baseline. Parity is the gate, not zero —
        # a count that rises by one is a finding; the number itself is not.
        run: |
          BASELINE=1421
          COUNT=$(npx eslint . 2>&1 | grep -oE '✖ [0-9]+ problems' | grep -oE '[0-9]+' | head -1 || echo 0)
          echo "eslint problems: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::Lint regressed: $COUNT > $BASELINE"
            exit 1
          fi

  tests:
    name: tests · including admin role enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # A missing secret does not announce itself. GitHub substitutes an empty
      # string, `hasTestCreds` goes false, and 102 role-enforcement tests skip
      # — which the summary prints in grey next to a green tick. That is how
      # the first run of this workflow reported success on a job that verified
      # nothing. Name the empty one here, before anything else can absorb it.
      - name: Every secret this job needs is present
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
        run: |
          missing=""
          for k in E2E_ADMIN_PASSWORD E2E_BUYER_PASSWORD; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — set them in Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "all required secrets present"

      # Prove the credential BEFORE 800 tests run, and say which half is wrong.
      # A password grant answers this in one round trip, and the reply
      # distinguishes "wrong password" from "wrong project" from "unconfirmed
      # email" — three failures that are indistinguishable once they surface as
      # a skipped suite. The password never touches a shell word: node reads it
      # from the environment and JSON-encodes it, so `$` and `#` cannot expand.
      - name: The E2E credentials actually authenticate
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
        run: node scripts/verify-e2e-credentials.mjs buyer admin

      - name: Run the suite
        env:
          ALLOW_SKIP_LIVE_DB: "1"
          VITE_TEST_ADMIN_EMAIL: claude.e2e.admin@safedeal.test
          VITE_TEST_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          VITE_TEST_BUYER_EMAIL: claude.e2e.buyer@safedeal.test
          VITE_TEST_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
        run: |
          set -o pipefail
          bun run test 2>&1 | tee /tmp/test.log

      # Grepping the human-readable log for the word "skipped" is a guess about
      # a reporter's formatting. Count the results instead — a skip and a
      # failure are both stopping conditions, and the reason is printed.
      - name: The role-enforcement contract must actually run
        env:
          VITE_TEST_ADMIN_EMAIL: claude.e2e.admin@safedeal.test
          VITE_TEST_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          VITE_TEST_BUYER_EMAIL: claude.e2e.buyer@safedeal.test
          VITE_TEST_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
        run: |
          npx vitest run src/__tests__/admin-auth.contract.test.ts \
            --reporter=json --outputFile=/tmp/contract.json || true
          node -e '
            const r = require("/tmp/contract.json");
            const total = r.numTotalTests ?? 0;
            const passed = r.numPassedTests ?? 0;
            const failed = r.numFailedTests ?? 0;
            const notRun = total - passed - failed; // skipped + pending + todo
            console.log(`passed ${passed}/${total}, failed ${failed}, not-run ${notRun}`);
            if (total === 0) {
              console.log("::error::role enforcement produced no tests — it did not run");
              process.exit(1);
            }
            if (notRun > 0) {
              console.log(`::error::${notRun} role-enforcement tests were skipped — a bad or missing E2E credential makes the suite skip in beforeAll, which is not a pass`);
              process.exit(1);
            }
            if (failed > 0 || r.success !== true) {
              for (const f of r.testResults || []) {
                for (const t of f.assertionResults || []) {
                  if (t.status === "failed") {
                    console.log(`::error::${t.fullName}: ${((t.failureMessages||[]).join(" ").split("\n")[0])}`);
                  }
                }
              }
              process.exit(1);
            }
            const fs = require("fs");
            const expected = fs.readdirSync("supabase/functions").filter(n => n.startsWith("admin-")).length;
            console.log(`admin authorization contract verified: ${passed}/${total} across ${expected} admin functions`);
          '

  audit:
    name: mobile render audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # `npx playwright install` fetches the CLI into a temporary npx cache and
      # downloads browsers. It does not leave the `playwright` PACKAGE anywhere
      # `scripts/mobile-audit.mjs` can import from, which is why the first run
      # of this job reported "This audit needs Playwright" after apparently
      # installing it. Install the package globally — the script's loader
      # already falls back to `npm root -g` — then fetch the browser with the
      # binary that package provides, so the two cannot disagree about which
      # build is expected.
      - name: Install Playwright and Chromium
        run: |
          npm i -g playwright
          npx --yes playwright install --with-deps chromium
          node -e 'require(require("child_process").execSync("npm root -g",{encoding:"utf8"}).trim()+"/playwright"); console.log("playwright resolvable")'

      - name: Every secret this job needs is present
        env:
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
          E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          missing=""
          for k in E2E_BUYER_PASSWORD E2E_SELLER_PASSWORD E2E_ADMIN_PASSWORD; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi
          echo "all required secrets present"

      # Chromium's 400 arrives 20 minutes into a render sweep and reads as a
      # layout failure. Ask the same question in one round trip first, before a
      # browser is launched, and name the account and the reason.
      - name: The E2E credentials actually authenticate
        env:
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
          E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/verify-e2e-credentials.mjs buyer seller admin

      # GitHub secrets are write-only: once saved, no token or API can read the
      # value back. So when a login is rejected there is no way to tell WHICH
      # value is actually stored, and we have now guessed wrong twice. A
      # SHA-256 fingerprint is not the secret and is not masked, so it can be
      # printed and compared against the values we believe were set. This
      # answers "is the stored secret the string we think it is?" without ever
      # revealing it. Informational only — it must never fail the job.
      - name: Fingerprint the E2E credentials (no secret value is printed)
        continue-on-error: true
        env:
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
          E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          # Hard-coded candidate hashes went stale the moment the credentials
          # were rotated, and a stale allowlist reports a correct secret as
          # unknown. What stays true after any rotation is the shape: all three
          # must be non-empty, and they must agree with each other if they are
          # meant to be the same password. A length and a hash prefix say that
          # without revealing anything.
          prev=""
          for k in E2E_BUYER_PASSWORD E2E_SELLER_PASSWORD E2E_ADMIN_PASSWORD; do
            v="${!k}"
            h=$(printf %s "$v" | sha256sum | cut -c1-12)
            warn=""
            case "$v" in
              *' ') warn=" [WARNING: ends with a space - likely a paste artifact]";;
              *$'\n'*) warn=" [WARNING: contains a newline - likely a paste artifact]";;
              *$'\r'*) warn=" [WARNING: contains a carriage return - likely a paste artifact]";;
            esac
            case "$v" in
              *'$'*) warn="$warn [note: contains a dollar sign, which shells and dotenv expand]";;
            esac
            echo "$k: length=${#v} sha256=$h$warn"
            if [ -n "$prev" ] && [ "$prev" != "$h" ]; then
              echo "  ^ differs from the previous credential's hash"
            fi
            prev="$h"
          done

      - name: Start the app
        run: |
          bun run dev -- --host 127.0.0.1 --port 5199 &
          npx wait-on http://127.0.0.1:5199 --timeout 90000

      - name: Audit every route at 320/360/390/414
        env:
          E2E_BUYER_EMAIL: claude.e2e.buyer@safedeal.test
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
          E2E_SELLER_EMAIL: claude.e2e.seller@safedeal.test
          E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
          E2E_ADMIN_EMAIL: claude.e2e.admin@safedeal.test
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/mobile-audit.mjs --auth --out audit-out

      - name: Keep the screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-screenshots
          path: audit-out
